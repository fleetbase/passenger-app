name: Passenger App CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: passenger-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Enable Corepack
              run: corepack enable

            - name: Cache yarn dependencies
              uses: actions/cache@v5
              with:
                  path: .yarn/cache
                  key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Lint
              run: yarn lint

            - name: Typecheck
              run: yarn typecheck

            - name: Test
              run: yarn test --ci --runInBand --no-watchman

            - name: Build for the web
              run: yarn web:build

    android_build:
        runs-on: ubuntu-latest
        needs: checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Enable Corepack
              run: corepack enable

            - name: Cache yarn dependencies
              uses: actions/cache@v5
              with:
                  path: .yarn/cache
                  key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Configure Node binary for Gradle
              run: echo "NODE_BINARY=$(command -v node)" >> $GITHUB_ENV

            # Maps stay blank without a key, which is fine for a build check.
            - name: Write local.properties
              run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > android/local.properties

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3

            - name: Cache Gradle
              uses: actions/cache@v5
              with:
                  path: |
                      ~/.gradle/wrapper
                      ~/.gradle/caches
                  key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Build Android debug APK
              run: |
                  cd android
                  chmod +x ./gradlew
                  ./gradlew assembleDebug --no-daemon --stacktrace

            - name: Upload Android APK
              uses: actions/upload-artifact@v6
              with:
                  name: android-debug-apk
                  path: android/app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 14

    ios_build:
        runs-on: macos-latest
        needs: checks
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Setup Ruby and Bundler
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.2'
                  bundler-cache: true

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Enable Corepack
              run: corepack enable

            - name: Cache yarn dependencies
              uses: actions/cache@v5
              with:
                  path: .yarn/cache
                  key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install dependencies
              run: yarn install --immutable

            - name: Configure Node binary for native build
              run: echo "NODE_BINARY=$(command -v node)" >> $GITHUB_ENV

            - name: Cache CocoaPods
              uses: actions/cache@v5
              with:
                  path: |
                      ios/Pods
                      ~/Library/Caches/CocoaPods
                  key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pods-

            - name: Install CocoaPods
              run: cd ios && bundle exec pod install

            - name: Build iOS app for the simulator
              run: |
                  cd ios
                  xcodebuild -workspace PassengerApp.xcworkspace \
                    -scheme PassengerApp \
                    -configuration Debug \
                    -sdk iphonesimulator \
                    -destination "generic/platform=iOS Simulator" \
                    -derivedDataPath build \
                    CODE_SIGNING_ALLOWED=NO \
                    build
